<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: #ddd;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00d4ff;
        }

        .container {
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 50px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            margin-bottom: 30px;
        }

        .modal-header h2 {
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            margin-right: 8px;
            transition: all 0.2s;
        }

        .btn-edit {
            background: rgba(138, 43, 226, 0.2);
            color: #ba68c8;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .btn-edit:hover {
            background: rgba(138, 43, 226, 0.3);
        }

        .btn-delete {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(255, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">MGMT</a>
        <div class="navbar-links">
            <a href="employees.html" class="nav-link">Employees</a>
            <a href="projects.html" class="nav-link">Projects</a>
            <a href="tasks.html" class="nav-link">Tasks</a>
            <a href="users.html" class="nav-link">Users</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Employees Management</h1>
            <button class="btn" onclick="openModal()">+ Add Employee</button>
        </div>

        <div class="table-container">
            <table id="employees-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Last Name</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employees-body">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <p>Loading employees...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Employee</h2>
            </div>
            <form id="employee-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <input type="text" id="role" required>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        const TOKEN = sessionStorage.getItem('token') || 'your-token-here';
        let editingId = null;

        if (!sessionStorage.getItem('username')) {
            window.location.href = 'index.html';
        }

        async function loadEmployees() {
            try {
                const response = await fetch(`${API_URL}/employees`, {
                    headers: { 'Authorization': TOKEN }
                });
                const employees = await response.json();
                
                const tbody = document.getElementById('employees-body');
                
                if (employees.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">
                                <p>No employees found. Add your first employee!</p>
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                tbody.innerHTML = employees.map(emp => `
                    <tr>
                        <td>${emp.employeeId}</td>
                        <td>${emp.name}</td>
                        <td>${emp.lastName}</td>
                        <td>${emp.role}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editEmployee(${emp.employeeId})">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteEmployee(${emp.employeeId})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading employees:', error);
            }
        }

        function openModal(employee = null) {
            editingId = employee ? employee.employeeId : null;
            document.getElementById('modal-title').textContent = employee ? 'Edit Employee' : 'Add Employee';
            
            if (employee) {
                document.getElementById('name').value = employee.name;
                document.getElementById('lastName').value = employee.lastName;
                document.getElementById('role').value = employee.role;
            } else {
                document.getElementById('employee-form').reset();
            }
            
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            editingId = null;
        }

        async function editEmployee(id) {
            try {
                const response = await fetch(`${API_URL}/employees/${id}`, {
                    headers: { 'Authorization': TOKEN }
                });
                const employee = await response.json();
                openModal(employee);
            } catch (error) {
                console.error('Error fetching employee:', error);
            }
        }

        async function deleteEmployee(id) {
            if (!confirm('Are you sure you want to delete this employee?')) return;
            
            try {
                await fetch(`${API_URL}/employees/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': TOKEN }
                });
                loadEmployees();
            } catch (error) {
                console.error('Error deleting employee:', error);
            }
        }

        document.getElementById('employee-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('name').value,
                lastName: document.getElementById('lastName').value,
                role: document.getElementById('role').value
            };
            
            try {
                const url = editingId ? `${API_URL}/employees/${editingId}` : `${API_URL}/employees`;
                const method = editingId ? 'PUT' : 'POST';
                
                await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': TOKEN
                    },
                    body: JSON.stringify(data)
                });
                
                closeModal();
                loadEmployees();
            } catch (error) {
                console.error('Error saving employee:', error);
            }
        });

        loadEmployees();
    </script>
</body>
</html>
