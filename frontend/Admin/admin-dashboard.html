<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Projelite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            color: #ddd;
        }

        .btn-logout {
            padding: 10px 20px;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: transparent;
            color: #ff6b6b;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 40px;
        }

        .welcome h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #ddd;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #ddd;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #fff;
        }

        .action-card:hover {
            transform: translateY(-5px);
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
        }

        .action-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00d4ff;
        }

        .action-desc {
            color: #ddd;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .container {
                padding: 0 15px;
            }

            .welcome h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Projelite Admin</div>
        <div class="navbar-right">
            <span class="user-info">Welcome, <strong id="username"></strong></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="welcome">
            <h1>Dashboard</h1>
            <p>Manage your team, projects, and tasks efficiently</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalEmployees">0</div>
                <div class="stat-label">Total Employees</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalProjects">0</div>
                <div class="stat-label">Total Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
        </div>

        <h2 style="margin-bottom: 20px;">Quick Actions</h2>
        <div class="quick-actions">
            <a href="admin-employees.html" class="action-card">
                <div class="action-title">Employees</div>
                <div class="action-desc">Manage employee accounts</div>
            </a>

            <a href="admin-projects.html" class="action-card">
                <div class="action-title">Projects</div>
                <div class="action-desc">View and manage projects</div>
            </a>

            <a href="admin-tasks.html" class="action-card">
                <div class="action-title">Tasks</div>
                <div class="action-desc">Assign and track tasks</div>
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8091';

        function checkAuth() {
            const token = localStorage.getItem('token');
            const userType = localStorage.getItem('userType');
            
            if (!token || userType !== 'admin') {
                window.location.href = 'login-company.html';
                return;
            }

            document.getElementById('username').textContent = localStorage.getItem('username') || 'Admin';
        }

        async function loadStats() {
            const token = localStorage.getItem('token');

            try {
                const [employeesRes, projectsRes, tasksRes] = await Promise.all([
                    fetch(`${API_URL}/admin/employees`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`${API_URL}/admin/projects`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`${API_URL}/admin/tasks`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);

                if (employeesRes.ok) {
                    const employees = await employeesRes.json();
                    document.getElementById('totalEmployees').textContent = employees.length;
                }

                if (projectsRes.ok) {
                    const projects = await projectsRes.json();
                    document.getElementById('totalProjects').textContent = projects.length;
                }

                if (tasksRes.ok) {
                    const tasks = await tasksRes.json();
                    document.getElementById('totalTasks').textContent = tasks.length;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }

        checkAuth();
        loadStats();
    </script>
</body>
</html>
