<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Projelite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-logout {
            padding: 10px 20px;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: transparent;
            color: #ff6b6b;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-danger {
            background: #ff6b6b;
            color: #fff;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #00d4ff;
            font-weight: bold;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.8em;
            color: #00d4ff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff6b6b;
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .back-link {
            display: inline-block;
            color: #ddd;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #00d4ff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .table-container {
                overflow-x: scroll;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="admin-dashboard.html" class="navbar-brand">Projelite Admin</a>
        <div class="navbar-right">
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <a href="admin-dashboard.html" class="back-link">&larr; Back to Dashboard</a>

        <div class="header">
            <h1>Employee Management</h1>
            <button class="btn" onclick="openCreateModal()">Create New Employee</button>
        </div>

        <div id="alert" class="alert"></div>

        <div class="table-container">
            <table id="employeesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeesBody">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <h3>Loading employees...</h3>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Employee</h2>
            </div>
            <form id="createForm">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="createName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="createLastName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="createEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="createPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="createRole" placeholder="e.g., Developer, Designer" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn">Create Employee</button>
                    <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Employee</h2>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="editLastName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="editRole" required>
                </div>
                <div class="form-group">
                    <label>New Password (leave empty to keep current)</label>
                    <input type="password" id="editPassword" minlength="6">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn">Save Changes</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        let employees = [];

        function checkAuth() {
            const token = localStorage.getItem('token');
            const userType = localStorage.getItem('userType');
            
            if (!token || userType !== 'admin') {
                window.location.href = 'login-company.html';
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        async function loadEmployees() {
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_URL}/admin/employees`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    employees = await response.json();
                    renderEmployees();
                } else {
                    showAlert('Failed to load employees', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        }

        function renderEmployees() {
            const tbody = document.getElementById('employeesBody');
            
            if (employees.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <h3>No employees found</h3>
                            <p>Create your first employee to get started</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = employees.map(emp => `
                <tr>
                    <td>${emp.employeeId}</td>
                    <td>${emp.name} ${emp.lastName}</td>
                    <td>${emp.Email}</td>
                    <td>${emp.role}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-small btn-secondary" onclick="openEditModal(${emp.employeeId})">Edit</button>
                            <button class="btn btn-small btn-danger" onclick="deleteEmployee(${emp.employeeId})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.add('show');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('show');
            document.getElementById('createForm').reset();
        }

        function openEditModal(id) {
            const employee = employees.find(e => e.employeeId === id);
            if (!employee) return;

            document.getElementById('editId').value = employee.employeeId;
            document.getElementById('editName').value = employee.name;
            document.getElementById('editLastName').value = employee.lastName;
            document.getElementById('editEmail').value = employee.Email;
            document.getElementById('editRole').value = employee.role;
            document.getElementById('editPassword').value = '';
            
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            document.getElementById('editForm').reset();
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');

            const data = {
                name: document.getElementById('createName').value,
                lastName: document.getElementById('createLastName').value,
                email: document.getElementById('createEmail').value,
                password: document.getElementById('createPassword').value,
                role: document.getElementById('createRole').value
            };

            try {
                const response = await fetch(`${API_URL}/admin/employees`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Employee created successfully', 'success');
                    closeCreateModal();
                    loadEmployees();
                } else {
                    const error = await response.json();
                    showAlert(error.error || 'Failed to create employee', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const id = document.getElementById('editId').value;

            const data = {
                name: document.getElementById('editName').value,
                lastName: document.getElementById('editLastName').value,
                Email: document.getElementById('editEmail').value,
                role: document.getElementById('editRole').value
            };

            const password = document.getElementById('editPassword').value;
            if (password) {
                data.password = password;
            }

            try {
                const response = await fetch(`${API_URL}/admin/employees/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Employee updated successfully', 'success');
                    closeEditModal();
                    loadEmployees();
                } else {
                    const error = await response.json();
                    showAlert(error.error || 'Failed to update employee', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        });

        async function deleteEmployee(id) {
            if (!confirm('Are you sure you want to delete this employee?')) return;

            const token = localStorage.getItem('token');

            try {
                const response = await fetch(`${API_URL}/admin/employees/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('Employee deleted successfully', 'success');
                    loadEmployees();
                } else {
                    showAlert('Failed to delete employee', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }

        checkAuth();
        loadEmployees();
    </script>
</body>
</html>
