<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management - Projelite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-logout {
            padding: 10px 20px;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: transparent;
            color: #ff6b6b;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-danger {
            background: #ff6b6b;
            color: #fff;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #00d4ff;
            font-weight: bold;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-received {
            background: rgba(100, 149, 237, 0.3);
            color: #6495ed;
        }

        .status-in-progress {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .status-completed {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.8em;
            color: #00d4ff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1em;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff6b6b;
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .back-link {
            display: inline-block;
            color: #ddd;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #00d4ff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .table-container {
                overflow-x: scroll;
            }

            table {
                min-width: 800px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="admin-dashboard.html" class="navbar-brand">Projelite Admin</a>
        <div class="navbar-right">
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <a href="admin-dashboard.html" class="back-link">&larr; Back to Dashboard</a>

        <div class="header">
            <h1>Task Management</h1>
            <button class="btn" onclick="openCreateModal()">Create New Task</button>
        </div>

        <div id="alert" class="alert"></div>

        <div class="table-container">
            <table id="tasksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Task Name</th>
                        <th>Description</th>
                        <th>Project</th>
                        <th>Employee</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tasksBody">
                    <tr>
                        <td colspan="7" class="empty-state">
                            <h3>Loading tasks...</h3>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Task</h2>
            </div>
            <form id="createForm">
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="createName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="createDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label>Assign to Project</label>
                    <select id="createProject" required>
                        <option value="">Select Project</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assign to Employee</label>
                    <select id="createEmployee" required>
                        <option value="">Select Employee</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="createStatus" required>
                        <option value="Received">Received</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn">Create Task</button>
                    <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Task</h2>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label>Assign to Project</label>
                    <select id="editProject" required>
                        <option value="">Select Project</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assign to Employee</label>
                    <select id="editEmployee" required>
                        <option value="">Select Employee</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus" required>
                        <option value="Received">Received</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn">Save Changes</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8091';
        let tasks = [];
        let employees = [];
        let projects = [];

        function checkAuth() {
            const token = localStorage.getItem('token');
            const userType = localStorage.getItem('userType');
            
            if (!token || userType !== 'admin') {
                window.location.href = 'login-company.html';
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        async function loadEmployees() {
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_URL}/admin/employees`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    employees = await response.json();
                    populateEmployeeSelects();
                }
            } catch (error) {
                console.error('Error loading employees:', error);
            }
        }

        async function loadProjects() {
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_URL}/admin/projects`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    projects = await response.json();
                    populateProjectSelects();
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        function populateEmployeeSelects() {
            const createSelect = document.getElementById('createEmployee');
            const editSelect = document.getElementById('editEmployee');
            
            const options = employees.map(emp => 
                `<option value="${emp.employeeId}">${emp.name} ${emp.lastName} - ${emp.role}</option>`
            ).join('');

            createSelect.innerHTML = '<option value="">Select Employee</option>' + options;
            editSelect.innerHTML = '<option value="">Select Employee</option>' + options;
        }

        function populateProjectSelects() {
            const createSelect = document.getElementById('createProject');
            const editSelect = document.getElementById('editProject');
            
            const options = projects.map(proj => 
                `<option value="${proj.id}">${proj.name}</option>`
            ).join('');

            createSelect.innerHTML = '<option value="">Select Project</option>' + options;
            editSelect.innerHTML = '<option value="">Select Project</option>' + options;
        }

        async function loadTasks() {
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_URL}/admin/tasks`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    tasks = await response.json();
                    renderTasks();
                } else {
                    showAlert('Failed to load tasks', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        }

        function getStatusClass(status) {
            if (status === 'Received') return 'status-received';
            if (status === 'In Progress') return 'status-in-progress';
            if (status === 'Completed') return 'status-completed';
            return 'status-received';
        }

        function renderTasks() {
            const tbody = document.getElementById('tasksBody');
            
            if (tasks.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <h3>No tasks found</h3>
                            <p>Create your first task to get started</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = tasks.map(task => {
                const employee = employees.find(e => e.employeeId === task.idEmployee);
                const project = projects.find(p => p.id === task.idProject);
                const employeeName = employee ? `${employee.name} ${employee.lastName}` : 'Unassigned';
                const projectName = project ? project.name : 'No Project';
                
                return `
                    <tr>
                        <td>${task.id}</td>
                        <td>${task.name}</td>
                        <td>${task.description}</td>
                        <td>${projectName}</td>
                        <td>${employeeName}</td>
                        <td><span class="status-badge ${getStatusClass(task.status)}">${task.status}</span></td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-small btn-secondary" onclick="openEditModal(${task.id})">Edit</button>
                                <button class="btn btn-small btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.add('show');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('show');
            document.getElementById('createForm').reset();
        }

        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('editId').value = task.id;
            document.getElementById('editName').value = task.name;
            document.getElementById('editDescription').value = task.description;
            document.getElementById('editProject').value = task.idProject;
            document.getElementById('editEmployee').value = task.idEmployee;
            document.getElementById('editStatus').value = task.status;
            
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            document.getElementById('editForm').reset();
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');

            const data = {
                name: document.getElementById('createName').value,
                description: document.getElementById('createDescription').value,
                idProject: parseInt(document.getElementById('createProject').value),
                idEmployee: parseInt(document.getElementById('createEmployee').value),
                status: document.getElementById('createStatus').value
            };

            try {
                const response = await fetch(`${API_URL}/admin/tasks`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Task created successfully', 'success');
                    closeCreateModal();
                    loadTasks();
                } else {
                    const error = await response.json();
                    showAlert(error.error || 'Failed to create task', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const id = document.getElementById('editId').value;

            const data = {
                name: document.getElementById('editName').value,
                description: document.getElementById('editDescription').value,
                idProject: parseInt(document.getElementById('editProject').value),
                idEmployee: parseInt(document.getElementById('editEmployee').value),
                status: document.getElementById('editStatus').value
            };

            try {
                const response = await fetch(`${API_URL}/admin/tasks/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Task updated successfully', 'success');
                    closeEditModal();
                    loadTasks();
                } else {
                    const error = await response.json();
                    showAlert(error.error || 'Failed to update task', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        });

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            const token = localStorage.getItem('token');

            try {
                const response = await fetch(`${API_URL}/admin/tasks/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    showAlert('Task deleted successfully', 'success');
                    loadTasks();
                } else {
                    showAlert('Failed to delete task', 'error');
                }
            } catch (error) {
                showAlert('Network error', 'error');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }

        checkAuth();
        Promise.all([loadEmployees(), loadProjects()]).then(() => loadTasks());
    </script>
</body>
</html>
