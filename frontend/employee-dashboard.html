<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - Projelite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            color: #ddd;
        }

        .btn-logout {
            padding: 10px 20px;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: transparent;
            color: #ff6b6b;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 40px;
        }

        .welcome h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #ddd;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            padding: 15px 30px;
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            color: #00d4ff;
        }

        .tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #ddd;
            margin-top: 8px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #00d4ff;
        }

        .card-content {
            color: #ddd;
            line-height: 1.6;
        }

        .status-badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-received {
            background: rgba(100, 149, 237, 0.3);
            color: #6495ed;
        }

        .status-in-progress {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .status-completed {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .status-select {
            padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .status-select:hover {
            border-color: #00d4ff;
        }

        .status-select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .project-info {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9em;
            color: #aaa;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff6b6b;
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .tabs {
                overflow-x: auto;
            }

            .tab {
                white-space: nowrap;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Projelite Employee</div>
        <div class="navbar-right">
            <span class="user-info">Welcome, <strong id="employeeName"></strong></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="welcome">
            <h1>My Dashboard</h1>
            <p>Manage your assigned tasks and projects</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="receivedTasks">0</div>
                <div class="stat-label">Received</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inProgressTasks">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('tasks')">My Tasks</button>
            <button class="tab" onclick="switchTab('projects')">My Projects</button>
        </div>

        <div id="alert" class="alert"></div>

        <div id="tasksTab" class="tab-content active">
            <div id="tasksContainer"></div>
        </div>

        <div id="projectsTab" class="tab-content">
            <div id="projectsContainer"></div>
        </div>
    </div>

    <script>
    const API_URL = 'http://localhost:8080';
    let tasks = [];
    let projects = [];

    function checkAuth() {
        const token = localStorage.getItem('token');
        const userType = localStorage.getItem('userType');
        
        console.log('Auth check:', { 
            hasToken: !!token, 
            userType: userType,
            tokenPreview: token ? token.substring(0, 20) + '...' : 'none'
        });
        
        if (!token || userType !== 'employee') {
            console.log('Auth failed, redirecting to login...');
            window.location.replace('login-employee.html');
            return false;
        }

        const employeeName = localStorage.getItem('employeeName');
        document.getElementById('employeeName').textContent = employeeName || 'Employee';
        return true;
    }

    function showAlert(message, type) {
        const alert = document.getElementById('alert');
        alert.textContent = message;
        alert.className = `alert alert-${type} show`;
        setTimeout(() => {
            alert.classList.remove('show');
        }, 5000);
    }

    function switchTab(tabName) {
        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => tab.classList.remove('active'));
        contents.forEach(content => content.classList.remove('active'));

        document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
        document.getElementById(`${tabName}Tab`).classList.add('active');
    }

    async function loadTasks() {
        const token = localStorage.getItem('token');
        
        console.log('Loading tasks...');
        
        try {
            const response = await fetch(`${API_URL}/employee/tasks`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            console.log('Tasks response:', response.status, response.statusText);

            if (response.status === 401 || response.status === 403) {
                showAlert('Session expired. Please login again.', 'error');
                setTimeout(() => {
                    localStorage.clear();
                    window.location.replace('index.html');
                }, 2000);
                return;
            }

            if (response.ok) {
                tasks = await response.json();
                console.log('Tasks loaded:', tasks.length, tasks);
                renderTasks();
                updateStats();
            } else {
                const error = await response.json();
                console.error('Tasks error:', error);
                showAlert(error.message || error.error || 'Failed to load tasks', 'error');
            }
        } catch (error) {
            console.error('Network error loading tasks:', error);
            showAlert('Network error loading tasks', 'error');
        }
    }

    async function loadProjects() {
        const token = localStorage.getItem('token');
        
        console.log('Loading projects...');
        
        try {
            const response = await fetch(`${API_URL}/employee/projects`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            console.log('Projects response:', response.status, response.statusText);

            if (response.status === 401 || response.status === 403) {
                showAlert('Session expired. Please login again.', 'error');
                setTimeout(() => {
                    localStorage.clear();
                    window.location.replace('login-employee.html');
                }, 2000);
                return;
            }

            if (response.ok) {
                projects = await response.json();
                console.log('Projects loaded:', projects.length, projects);
                renderProjects();
            } else {
                const error = await response.json();
                console.error('Projects error:', error);
                showAlert(error.message || error.error || 'Failed to load projects', 'error');
            }
        } catch (error) {
            console.error('Network error loading projects:', error);
            showAlert('Network error loading projects', 'error');
        }
    }

    function updateStats() {
        document.getElementById('totalTasks').textContent = tasks.length;
        document.getElementById('receivedTasks').textContent = tasks.filter(t => t.status === 'Received').length;
        document.getElementById('inProgressTasks').textContent = tasks.filter(t => t.status === 'In Progress').length;
        document.getElementById('completedTasks').textContent = tasks.filter(t => t.status === 'Completed').length;
    }

    function getStatusClass(status) {
        if (status === 'Received') return 'status-received';
        if (status === 'In Progress') return 'status-in-progress';
        if (status === 'Completed') return 'status-completed';
        return 'status-received';
    }

    function renderTasks() {
        const container = document.getElementById('tasksContainer');
        
        if (tasks.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No tasks assigned</h3>
                    <p>You don't have any tasks assigned yet</p>
                </div>
            `;
            return;
        }

        container.innerHTML = tasks.map(task => `
            <div class="card">
                <div class="card-header">
                    <div class="card-title">${task.name || 'Unnamed Task'}</div>
                    <select class="status-select" onchange="updateTaskStatus(${task.id}, this.value)">
                        <option value="Received" ${task.status === 'Received' ? 'selected' : ''}>Received</option>
                        <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
                    </select>
                </div>
                <div class="card-content">
                    <p>${task.description || 'No description'}</p>
                    <div class="project-info">
                        Task ID: ${task.id} | Project ID: ${task.idProject || 'N/A'}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderProjects() {
        const container = document.getElementById('projectsContainer');
        
        if (projects.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No projects assigned</h3>
                    <p>You are not assigned to any projects yet</p>
                </div>
            `;
            return;
        }

        container.innerHTML = projects.map(project => {
            const projectTasks = tasks.filter(t => t.idProject === project.id);
            
            return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">${project.name || 'Unnamed Project'}</div>
                        <span class="status-badge status-in-progress">${projectTasks.length} Tasks</span>
                    </div>
                    <div class="card-content">
                        <p>${project.description || 'No description'}</p>
                        <div class="project-info">
                            Project ID: ${project.id}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function updateTaskStatus(taskId, newStatus) {
        const token = localStorage.getItem('token');

        console.log('Updating task status:', taskId, newStatus);

        try {
            const response = await fetch(`${API_URL}/employee/tasks/${taskId}/status`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: newStatus })
            });

            if (response.ok) {
                showAlert('Task status updated successfully', 'success');
                await loadTasks();
            } else {
                const error = await response.json();
                showAlert(error.message || error.error || 'Failed to update task status', 'error');
                await loadTasks();
            }
        } catch (error) {
            console.error('Error updating task status:', error);
            showAlert('Network error', 'error');
            await loadTasks();
        }
    }
    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
    console.log('Current localStorage:', {
        token: localStorage.getItem('token') ? 'exists' : 'missing',
        userType: localStorage.getItem('userType'),
        employeeId: localStorage.getItem('employeeId'),
        employeeName: localStorage.getItem('employeeName')
    });

    if (checkAuth()) {
        console.log('Auth successful, loading data...');
        loadTasks();
        loadProjects();
    } else {
        console.log('Auth failed');
    }
</script>
</body>
</html>
