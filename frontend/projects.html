<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: #ddd;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #00d4ff;
        }

        .container {
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 50px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 26, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            margin-bottom: 30px;
        }

        .modal-header h2 {
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid rgba(138, 43, 226, 0.3);
            color: #ba68c8;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            margin-right: 8px;
            transition: all 0.2s;
        }

        .btn-edit {
            background: rgba(138, 43, 226, 0.2);
            color: #ba68c8;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        .btn-edit:hover {
            background: rgba(138, 43, 226, 0.3);
        }

        .btn-delete {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(255, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">MGMT</a>
        <div class="navbar-links">
            <a href="employees.html" class="nav-link">Employees</a>
            <a href="projects.html" class="nav-link">Projects</a>
            <a href="tasks.html" class="nav-link">Tasks</a>
            <a href="users.html" class="nav-link">Users</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1> Projects Management</h1>
            <button class="btn" onclick="openModal()">+ Add Project</button>
        </div>

        <div class="table-container">
            <table id="projects-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Project Name</th>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="projects-body">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <p>Loading projects...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Project</h2>
            </div>
            <form id="project-form">
                <div class="form-group">
                    <label for="nameProject">Project Name</label>
                    <input type="text" id="nameProject" required>
                </div>
                <div class="form-group">
                    <label for="idEmployee">Assign to Employee</label>
                    <select id="idEmployee" required>
                        <option value="">Select an employee...</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        const TOKEN = sessionStorage.getItem('token') || 'your-token-here';
        let editingId = null;
        let employees = [];

        if (!sessionStorage.getItem('username')) {
            window.location.href = 'index.html';
        }

        async function loadEmployees() {
            try {
                const response = await fetch(`${API_URL}/employees`, {
                    headers: { 'Authorization': TOKEN }
                });
                employees = await response.json();
                
                const select = document.getElementById('idEmployee');
                select.innerHTML = '<option value="">Select an employee...</option>' +
                    employees.map(emp => `<option value="${emp.employeeId}">${emp.name} ${emp.lastName}</option>`).join('');
            } catch (error) {
                console.error('Error loading employees:', error);
            }
        }

        async function loadProjects() {
            try {
                const response = await fetch(`${API_URL}/projects`, {
                    headers: { 'Authorization': TOKEN }
                });
                const projects = await response.json();
                
                const tbody = document.getElementById('projects-body');
                
                if (projects.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">
                                <div class="empty-state-icon">📊</div>
                                <p>No projects found. Create your first project!</p>
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                tbody.innerHTML = projects.map(proj => {
                    const employee = employees.find(e => e.employeeId === proj.idEmployee);
                    const empName = employee ? `${employee.name} ${employee.lastName}` : 'Unassigned';
                    
                    return `
                        <tr>
                            <td>${proj.id}</td>
                            <td>${proj.nameProject}</td>
                            <td>${proj.idEmployee || '-'}</td>
                            <td>${empName}</td>
                            <td>
                                <button class="action-btn btn-edit" onclick="editProject(${proj.id})">Edit</button>
                                <button class="action-btn btn-delete" onclick="deleteProject(${proj.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        function openModal(project = null) {
            editingId = project ? project.id : null;
            document.getElementById('modal-title').textContent = project ? 'Edit Project' : 'Add Project';
            
            if (project) {
                document.getElementById('nameProject').value = project.nameProject;
                document.getElementById('idEmployee').value = project.idEmployee || '';
            } else {
                document.getElementById('project-form').reset();
            }
            
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            editingId = null;
        }

        async function editProject(id) {
            try {
                const response = await fetch(`${API_URL}/projects/${id}`, {
                    headers: { 'Authorization': TOKEN }
                });
                const project = await response.json();
                openModal(project);
            } catch (error) {
                console.error('Error fetching project:', error);
            }
        }

        async function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project?')) return;
            
            try {
                await fetch(`${API_URL}/projects/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': TOKEN }
                });
                loadProjects();
            } catch (error) {
                console.error('Error deleting project:', error);
            }
        }

        document.getElementById('project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                nameProject: document.getElementById('nameProject').value,
                idEmployee: parseInt(document.getElementById('idEmployee').value) || null
            };
            
            try {
                const url = editingId ? `${API_URL}/projects/${editingId}` : `${API_URL}/projects`;
                const method = editingId ? 'PUT' : 'POST';
                
                await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': TOKEN
                    },
                    body: JSON.stringify(data)
                });
                
                closeModal();
                loadProjects();
            } catch (error) {
                console.error('Error saving project:', error);
            }
        });

        async function init() {
            await loadEmployees();
            await loadProjects();
        }

        init();
    </script>
</body>
</html>
